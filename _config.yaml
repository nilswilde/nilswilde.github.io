# site properties and page defaults
title: LISARt
subtitle: Lab for Intelligent Systems and Autonomous Robots
description: At LISARt we conduct robotics research in planning and navigation, human-robot interaction, multi-robot systems and multi-objective optimization.
header: images/background.jpg
footer: images/background.jpg
proofer: false
show-title: false

# site social media and other links
links:
  email: nils.wilde@dal.ca
  orcid: 0000-0003-3238-8153
  google-scholar: https://scholar.google.com/citations?user=lkAmFEEAAAAJ&hl=en
  github: nilswilde


### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
